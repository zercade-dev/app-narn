name: Feature request
description: Suggest a new capability or a larger improvement for NARN.
title: "🚀 Feature: <short summary — e.g. bulk re-run of failed strings>"
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or "what do you think about..." conversations,
        [Discussions](../../discussions) is often a better fit than an issue —
        feel free to start there instead if you're not yet sure this should be
        a concrete feature request.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that NARN doesn't currently support well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Sketches, mockups, or example config/output are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've tried or thought about.
