name: Bug report
description: Something in NARN isn't working the way it should.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **If this is a security
        vulnerability** (something that could expose credentials, the vault,
        or another user's data), please don't file it here — see
        [SECURITY.md](../../SECURITY.md) for private reporting instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The NARN version (or image tag/commit) you're running.
      placeholder: v1.62.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server console output or browser devtools output, if any. This is pasted as-is — please redact API keys or other secrets first.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you're running NARN (Docker image / from source), OS, and browser if relevant.
    validations:
      required: true
